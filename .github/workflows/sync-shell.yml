name: Sync Govbot header and footer

# Copies Govbot's shared header, mobile drawer and footer into site/index.html once a
# day, so a change to Govbot's menu shows up here too.
on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Sync
        run: python3 scripts/sync_shell.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Sync Govbot header and footer"
          git pull -q --rebase origin main && git push -q
